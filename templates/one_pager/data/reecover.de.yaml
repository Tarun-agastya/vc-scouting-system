sections:
  loesung: >-
    REEcover entwickelt eine patentierte Technologie zur selektiven Raffinierung und Rückgewinnung
    von Seltenerdmetallen aus Elektroschrott. Das Verfahren basiert auf einem bio-inspirierten
    Ansatz und dient der Gewinnung von Elementen wie Europium und Yttrium aus Energiesparlampen.
    Das Ziel ist die Etablierung einer kreislauforientierten Versorgungskette für kritische
    Rohstoffe.
  mehrwerte: >-
    Die Technologie ermöglicht eine Trennung von Seltenerdmetallen mit einem Faktor, der 10-mal
    höher ist als bei bestehenden Verfahren. Dadurch wird die Abhängigkeit von umweltschädlichem
    Bergbau reduziert und die Verfügbarkeit kritischer Rohstoffe für die digitale und energetische
    Transformation gesichert.
  usp: >-
    Im Gegensatz zu herkömmlichen Verfahren nutzt REEcover einen bio-inspirierten Ansatz zur
    selektiven Raffinierung. Diese patentierte Methode ermöglicht eine deutlich effizientere
    Trennung von Seltenerdmetallen aus Abfällen, was eine nachhaltigere Alternative zum konventionellen
    Bergbau und der damit verbundenen Entstehung von toxischen Abfällen darstellt.
  zielgruppe: >-
    Die Zielgruppe umfasst Unternehmen und Akteure in der Recyclingbranche sowie die Industrie
    der digitalen und energetischen Infrastruktur. Das Unternehmen wurde unter anderem als
    Gewinner des Rocket Day + Impact Award 2026 ausgezeichnet und ist Teil des Energy & Environment
    Accelerators.
  geschaeftsmodell: >-
    Das Unternehmen verfolgt ein B2B-Modell und verkauft die Technologie zur Rückgewinnung
    und Raffinierung von Seltenerdmetallen aus Abfällen an industrielle Partner.
