meta:
  page_label: Matchmaking-Startups

claim: "Echtzeit-Biodiversitätsmonitoring per Sensor und Satellit"

name: Hula Earth
location: München
founded: "2023"
team_size: "k. A."
website: hula.earth

sections:
  loesung: >
    Hula Earth misst Biodiversität in Echtzeit. Die selbst entwickelten
    BioT-Sensoren sind solarbetrieben und wartungsfrei und erkennen Arten —
    vor allem Vogelstimmen — per KI direkt auf dem Gerät, ohne
    SD-Kartenwechsel oder Batterietausch. Ergänzt wird das um
    Satelliten-Erdbeobachtung; die Hula-Plattform führt beide Datenquellen in
    einem Dashboard für Monitoring, Reporting und Verifizierung (MRV) zusammen.

  mehrwerte: >
    Über 80 Sensoren sind bereits im Feld im Einsatz (Stand Ende 2025). Die
    Verarbeitung direkt auf dem Gerät ersetzt einen erheblichen Teil manueller
    biologischer Feldarbeit. Das Dashboard liefert Kennzahlen zu
    Ökosystemvitalität, Blattflächenindex und Wasserspeicherkapazität und
    unterstützt die Berichtspflichten nach CSRD/ESRS E4.

  usp: >
    Nicht nur Sensorik oder nur Satellitendaten, sondern die Verschneidung
    beider: Stichproben aus repräsentativen Flächen lassen sich auf große
    Gebiete hochrechnen und ergeben ein skalierbares Bild der Biodiversität.
    Die Datenverarbeitung erfolgt in Echtzeit auf dem Gerät und ist
    datenschutzkonform. Hula Earth entwickelt zudem die ersten deutschen
    Biodiversitätszertifikate.

  zielgruppe: >
    Betreiber von Solar- und Windparks, Landwirtschaft, Projektentwickler
    (u. a. Moorrenaturierung), Naturschutzverbände sowie Zertifizierer und
    Versicherungen. Als Referenz nennt das Unternehmen Engie Green — dort wird
    die Windparksteuerung an den Vogelzug gekoppelt.

  geschaeftsmodell: >
    B2B: Verkauf bzw. Bereitstellung der BioT-Sensorik kombiniert mit einem
    Plattform- und Datenabonnement für MRV-Reporting. Biodiversitätszertifikate
    sind als zusätzlicher Erlöshebel adressiert.

