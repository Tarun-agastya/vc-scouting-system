claim: Biobased wood adhesive for CO₂-reduced wood materials
name: LIGARO
location: Hannover
founded: 2023 (Research start)
team_size: '6'
website: www.ligaro.org
logo: assets/ligaro/logo.jpg
sections:
  loesung: >-
    LIGARO develops biobased adhesives for wood materials, particularly for chipboards. The
    main component is protein from industrial by-products, such as those from the food industry.
    The adhesive is free of isocyanates and formaldehyde and fully biodegradable. Two patents
    are pending.
  mehrwerte: >-
    Up to 90% lower CO₂ emissions compared to conventional adhesives (internal benchmarking,
    compared to UF-, PF-, and PVAc-systems). 100% renewable raw materials at competitive pricing
    with comparable bond strength and water resistance.
  usp: >-
    Unique combination of water resistance and sustainability: LIGARO is the only provider
    in the market that is 100% recyclable, non-toxic, 100% based on renewable raw materials,
    and water-resistant. Established “sustainable” adhesives (Henkel Loctite HB S ECO, Solenis,
    Evertree) achieve 20-90% renewable raw materials but are not recyclable; competing startups
    like BindEthics are not water-resistant.
  zielgruppe: >-
    Industrial wood material manufacturers (chipboards). Since the start of customer outreach
    in October 2025, 7 customers with a combined annual demand of over 200,000 t of wood adhesive
    have committed to testing — including Sonae Arauco, EGGER, Hasslacher Norica Timber, Nordpan/Rubner,
    and elka Holzwerke. Several partners have signed letters of intent (LOI).
  geschaeftsmodell: >-
    B2B sales of the adhesive to wood material manufacturers. Planned market entry in 2028
    with four smaller manufacturers and a target volume of 500 t of adhesive.
