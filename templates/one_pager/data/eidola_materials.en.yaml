claim: Refining mineral by-products into secondary raw materials
name: Eidola Materials
location: Zurich
founded: '2025'
team_size: n/a
sections:
  loesung: >-
    Eidola Materials identifies, sources, and refines mineral by-products from gravel and
    stone extraction as well as from industrial processes. The company evaluates the technical
    properties of these waste materials and provides tailored raw material mixtures tailored
    to specific requirements such as grain size distribution and mineral composition. These
    secondary raw materials are reintegrated into regional supply chains.
  mehrwerte: >-
    The use of secondary raw materials increases material efficiency per extracted cubic meter
    and reduces costs for waste treatment and disposal. Furthermore, the use of these materials
    reduces dependence on new extractions and strengthens the sustainability of supply chains
    by utilizing already extracted resources.
  usp: >-
    Instead of relying on primary raw materials, Eidola Materials enables the integration
    of secondary raw materials into existing industrial processes through specific compatibility
    tests. The company provides technical and strategic consulting for both sides of the chain:
    for raw material suppliers for waste utilization and for industrial customers to diversify
    their raw material base.
  zielgruppe: >-
    The target group includes raw material suppliers from the extraction industry as well
    as industrial manufacturers of construction materials and architects. The effectiveness
    of the approach is proven by successful projects, such as the substitution of filter cakes
    in brick production or the development of products such as garden bricks from gravel washing
    sludge.
  geschaeftsmodell: >-
    The company generates revenue through the sale of refined raw material mixtures as well
    as by providing consulting and development services for the raw material industry and
    industrial manufacturers.
