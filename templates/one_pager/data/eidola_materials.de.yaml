claim: Veredelung mineralischer Nebenprodukte zu Sekundärrohstoffen
name: Eidola Materials
location: Zürich
founded: '2025'
team_size: k. A.
sections:
  loesung: >-
    Eidola Materials identifiziert, beschafft und veredelt mineralische Nebenprodukte aus
    dem Kies- und Steingewinnung sowie aus industriellen Prozessen. Die Unternehmen bewerten
    die technischen Eigenschaften dieser Reststoffe und stellen maßgeschneiderte Rohstoffmischungen
    bereit, die auf spezifische Anforderungen wie Korngrößenverteilung und mineralische Zusammensetzung
    abgestimmt sind. Diese Sekundärrohstoffe werden in regionale Lieferketten zurückgeführt.
  mehrwerte: >-
    Die Nutzung von Sekundärrohstoffen steigert die Materialeffizienz pro gefördertem Kubikmeter
    und senkt die Kosten für die Abfallbehandlung und -entsorgung. Zudem reduziert der Einsatz
    dieser Materialien die Abhängigkeit von neuen Förderungen und stärkt die Nachhaltigkeit
    der Lieferketten durch die Nutzung bereits geförderter Ressourcen.
  usp: >-
    Anstatt auf Primärrohstoffe zu setzen, ermöglicht Eidola Materials die Integration von
    Sekundärrohstoffen in bestehende industrielle Prozesse durch spezifische Kompatibilitätstests.
    Das Unternehmen bietet dabei eine technische und strategische Beratung für beide Seiten
    der Kette: für Rohstofflieferanten zur Abfallverwertung und für industrielle Abnehmer
    zur Diversifizierung ihrer Rohstoffbasis.
  zielgruppe: >-
    Die Zielgruppe umfasst Rohstofflieferer aus der Gewinnungsindustrie sowie industrielle
    Hersteller von Baustoffen und Architekten. Die Wirksamkeit des Ansatzes ist durch erfolgreiche
    Projekte belegt, wie die Substitution von Filterkuchen in der Ziegelproduktion oder die
    Entwicklung von Produkten wie Gartenziegeln aus Kieswaschschlamm.
  geschaeftsmodell: >-
    Das Unternehmen generiert Umsatz durch den Verkauf von veredelten Rohstoffmischungen sowie
    durch die Erbringung von Beratungs- und Entwicklungsleistungen für die Rohstoffindustrie
    und industrielle Hersteller.
