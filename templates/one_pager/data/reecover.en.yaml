sections:
  loesung: >-
    REEcover develops a patented technology for the selective refining and recovery of rare
    earth metals from electronic waste. The process is based on a bio-inspired approach and
    serves the extraction of elements such as europium and yttrium from energy-saving lamps.
    The goal is the establishment of a circular supply chain for critical raw materials.
  mehrwerte: >-
    The technology enables a separation of rare earth metals with a factor 10 times higher
    than existing processes. This reduces the dependence on environmentally harmful mining
    and secures the availability of critical raw materials for the digital and energy transformation.
  usp: >-
    In contrast to conventional processes, REEcover uses a bio-inspired approach for selective
    refining. This patented method enables a significantly more efficient separation of rare
    earth metals from waste, representing a more sustainable alternative to conventional mining
    and the associated generation of toxic waste.
  zielgruppe: >-
    The target group includes companies and actors in the recycling industry as well as the
    industry of digital and energy infrastructure. The company was recognized among others
    as the winner of the Rocket Day + Impact Award 2026 and is part of the Energy & Environment
    Accelerator.
  geschaeftsmodell: >-
    The company follows a B2B model and sells the technology for the recovery and refining
    of rare earth metals from waste to industrial partners.
