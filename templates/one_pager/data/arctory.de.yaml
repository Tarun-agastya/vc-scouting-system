sections:
  loesung: >-
    Arctory bietet eine Plattform, die es Fertigungsunternehmen ermöglicht, maßgeschneiderte
    Anwendungen für das Shopfloor-Management, die Produktionsplanung und die Instandhaltung
    zu erstellen. Das System integriert sich direkt über bestehende Datensätze wie ERP-, MES-
    und PLM-Systeme. Nutzer beschreiben ihre spezifischen Prozesse, um funktionale Apps ohne
    manuelles Coding zu generieren.
  mehrwerte: >-
    Die Plattform ermöglicht eine schnelle Digitalisierung von Fertigungsprozessen, indem
    sie manuelle Arbeit in Excel durch maßgeschneiderte Apps ersetzt. Das Unternehmen hat
    erfolgreich über 12 Shopfloor-Anwendungen pro Fabrik innerhalb eines Zeitraums von sechs
    Monaten aufgebaut, um Abläufe zu optimieren und den Datenfluss zu verbessern.
  usp: >-
    Im Gegensatz zu traditionellen IT-Projekten, die umfangreiche Entwicklungszeit erfordern,
    nutzt Arctory agentische KI, um Anwendungen in Minuten zu generieren. Das System gewährleistet
    Datensicherheit, da während der Erstellungsphase nur Softwarecode und Datenmodelle mit
    der KI geteilt werden, sodass die KI nach der Bereitstellung keinen Zugriff auf Produktionsdaten
    hat.
  zielgruppe: >-
    Die Zielkunden sind Fertigungsunternehmen und Operational Excellence Teams, die Tools
    für das Shopfloor-Management und Qualitätsaudits benötigen. Das Unternehmen hat Referenzen
    von Partnern wie ams OSRAM und Ventilatorenfabrik Oelde gesichert.
  geschaeftsmodell: >-
    Arctory agiert als Softwareplattform, die einen KI-gesteuerten Anwendungs-Builder für
    Fertigungsunternehmen bereitstellt, um deren Produktionsprozesse zu digitalisieren.
