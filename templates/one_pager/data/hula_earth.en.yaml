claim: Real-time biodiversity monitoring via sensor and satellite
name: Hula Earth
location: Munich
founded: '2023'
team_size: n/a
website: hula.earth
logo: assets/hula_earth/logo.jpg
sections:
  loesung: >-
    Hula Earth measures biodiversity in real-time. Self-developed BioT sensors are solar-powered
    and maintenance-free, recognizing species—especially bird sounds—via AI directly on the
    device without SD card swaps or battery replacements. Satellite observation complements
    this; the Hula platform integrates both data sources into a dashboard for monitoring,
    reporting, and verification (MRV).
  mehrwerte: >-
    Over 80 sensors are already in the field as of the end of 2025. Direct processing on the
    device replaces a significant part of manual biological fieldwork. The dashboard provides
    metrics for ecosystem vitality, leaf area index, and water storage capacity, supporting
    CSRD/ESRS E4 reporting obligations.
  usp: >-
    Not just sensor technology or satellite data, but the combination of both: Samples from
    representative areas can be extrapolated to large areas, providing a scalable picture
    of biodiversity. Data processing occurs in real-time on the device and is compliant with
    data protection regulations. Hula Earth is also developing the first German biodiversity
    certificates.
  zielgruppe: >-
    Operators of solar and wind parks, agriculture, project developers (e.g., wetland restoration),
    nature conservation associations, and certifiers and insurers. The company cites Engie
    Green as a reference—where wind park control is coupled with the bird migration schedule.
  geschaeftsmodell: >-
    B2B: Sale or provision of BioT sensor technology combined with a platform and data subscription
    for MRV reporting. Biodiversity certificates are an additional revenue stream.
