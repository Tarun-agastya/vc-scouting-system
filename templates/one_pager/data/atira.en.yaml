sections:
  loesung: >-
    Atira offers an AI-powered orchestration layer for industrial sales processes, particularly
    for companies selling complex, customized products. The platform automates the processing
    of requests for quotation (RFQ) by integrating existing CRM, ERP, and CPQ systems. It
    extracts requirements from documents, checks them for risks, and automatically creates
    technical and commercial documentation.
  mehrwerte: >-
    The platform significantly reduces the manual effort in processing requests for quotation.
    A specific example shows that the extraction of RFQ data, which would normally require
    two to three days of manual work, can be completed by Atira in just 15 minutes.
  usp: >-
    In contrast to traditional manual processes, which often take weeks and require dependence
    on a few experts, Atira automates the entire workflow from requirement analysis to document
    creation. The solution connects existing corporate data with AI agents to make expert
    knowledge scalable.
  zielgruppe: >-
    The target group includes industrial companies and manufacturers offering complex, customized
    products and services. The solution has already been successfully tested with leading
    global industrial companies in the fields of manufacturing and Industry 4.0.
  geschaeftsmodell: >-
    The company follows a B2B business model and sells its AI platform for automating sales
    and quotation processes to industrial companies.
