sections:
  loesung: >-
    Atira bietet eine KI-gestützte Orchestrierungsschicht für industrielle Vertriebsprozesse
    an, insbesondere für Unternehmen, die komplexe, auf Kundenwünsche zugeschnittene Produkte
    verkaufen. Die Plattform automatisiert die Bearbeitung von Angebotsanfragen (RFQ) durch
    die Integration bestehender CRM-, ERP- und CPQ-Systeme. Sie extrahiert Anforderungen aus
    Dokumenten, prüft diese auf Risiken und erstellt automatisch technische sowie kommerzielle
    Dokumentationen.
  mehrwerte: >-
    Die Plattform reduziert den manuellen Aufwand bei der Bearbeitung von Angebotsanfragen
    erheblich. Ein konkretes Beispiel zeigt, dass die Extraktion von RFQ-Daten, die normalerweise
    zwei bis drei Tage manuelle Arbeit in Anspruch nehmen würden, durch Atira in nur 15 Minuten
    abgeschlossen werden kann.
  usp: >-
    Im Gegensatz zu herkömmlichen manuellen Prozessen, die oft Wochen dauern und die Abhängigkeit
    von wenigen Experten erfordern, automatisiert Atira den gesamten Workflow von der Anforderungsanalyse
    bis zur Dokumentenerstellung. Die Lösung verbindet bestehende Unternehmensdaten mit KI-Agenten,
    um Expertenwissen skalierbar zu machen.
  zielgruppe: >-
    Die Zielgruppe umfasst industrielle Unternehmen und Hersteller, die komplexe, maßgeschneiderte
    Produkte und Dienstleistungen anbieten. Die Lösung ist bereits bei weltweit führenden
    Industrieunternehmen im Bereich der Fertigung und Industrie 4.0 erfolgreich erprobt.
  geschaeftsmodell: >-
    Das Unternehmen verfolgt ein B2B-Geschäftsmodell und verkauft seine KI-Plattform zur Automatisierung
    von Vertriebs- und Angebotsprozessen an industrielle Unternehmen.
