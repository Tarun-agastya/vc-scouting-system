# LIGARO — GT Hub one-pager data.
# Source: LIGARO "Pitch Deck 2026" (provided 14 Aug 2026). Every figure below is
# traceable to a specific slide; see `sources:` at the bottom.

meta:
  page_label: Matchmaking-Startups

claim: "Biobasierter Holzklebstoff für CO₂-reduzierte Holzwerkstoffe"

name: LIGARO
location: Hannover
founded: "2023 (Forschungsstart)"
team_size: "6"
website: www.ligaro.org

sections:
  loesung: >
    LIGARO entwickelt biobasierte Klebstoffe für Holzwerkstoffe, insbesondere
    Spanplatten. Hauptbestandteil ist Protein aus industriellen Reststoffen,
    etwa aus der Lebensmittelindustrie. Der Klebstoff ist frei von Isocyanaten
    und Formaldehyd und vollständig biologisch abbaubar. Zwei Patente sind
    angemeldet.

  mehrwerte: >
    Bis zu 90 % geringere CO₂-Emissionen gegenüber konventionellen Klebstoffen
    (interne Bilanzierung, verglichen mit UF-, PF- und PVAc-Systemen). 100 %
    erneuerbare Rohstoffe bei preislicher Wettbewerbsfähigkeit sowie
    vergleichbarer Bindefestigkeit und Wasserfestigkeit.

  usp: >
    Einzigartige Kombination aus Wasserfestigkeit und Nachhaltigkeit: LIGARO ist
    im Wettbewerbsvergleich der einzige Anbieter, der zugleich 100 % recycelbar,
    ungiftig, zu 100 % aus erneuerbaren Rohstoffen und wasserfest ist.
    Etablierte "nachhaltige" Klebstoffe (Henkel Loctite HB S ECO, Solenis,
    Evertree) erreichen 20–90 % erneuerbare Rohstoffe, sind aber nicht
    recycelbar; konkurrierende Start-ups wie BindEthics sind nicht wasserfest.

  zielgruppe: >
    Industrielle Holzwerkstoffhersteller (Spanplatten). Seit Beginn der
    Kundenansprache im Oktober 2025 haben 7 Kunden mit einem Bedarf von
    zusammen über 200.000 t Holzklebstoff pro Jahr Tests zugesagt — darunter
    Sonae Arauco, EGGER, Hasslacher Norica Timber, Nordpan/Rubner und elka
    Holzwerke. Mit mehreren Partnern liegen unterzeichnete Absichtserklärungen
    (LOI) vor.

  geschaeftsmodell: >
    B2B-Verkauf des Klebstoffs an Holzwerkstoffhersteller. Geplanter
    Markteintritt 2028 mit vier kleineren Herstellern und einem Zielvolumen von
    500 t Klebstoff.

