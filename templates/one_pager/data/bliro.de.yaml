sections:
  loesung: >-
    Bliro bietet einen KI-Assistenten für Vertriebsmitarbeiter an, der den gesamten Workflow
    von der Vorbereitung bis zur Nachbereitung von Kundenterminen automatisiert. Die Lösung
    integriert sich in bestehende CRM-Systeme und ermöglicht die Erstellung von Besuchsberichten,
    die Pflege von Kalendern sowie das Versenden von Follow-up-E-Mails per Sprache. Zudem
    werden Online- und Vor-Ort-Meetings in Echtzeit transkribiert und die entsprechenden Daten
    automatisch in die CRM-Felder übertragen.
  mehrwerte: >-
    Die Nutzung der Plattform spart den Vertriebsmitarbeitern durchschnittlich 6 bis 8 Stunden
    pro Woche. Zudem führt die Automatisierung zu einer Steigerung der Conversion-Rate um
    22 % und einer Erhöhung des Deal-Wertes um 11 %.
  usp: >-
    Im Gegensatz zu herkömmlichen Lösungen bietet Bliro eine nahtlose Integration in Systeme
    wie SAP oder Salesforce ohne komplexes IT-Projekt. Die Plattform ermöglicht zudem ein
    autonomes, anonymes Coaching auf Basis von Playbooks, das ohne physische Begleitung oder
    Überwachung der Mitarbeiter funktioniert.
  zielgruppe: >-
    Die Zielgruppe umfasst Unternehmen im Bereich B2B-Vertrieb, Recruiting und Kundenservice.
    Zu den bereits bestätigten Kunden gehören namhafte Unternehmen wie igus, Telefónica, LANXESS
    und Stepstone.
  geschaeftsmodell: >-
    Das Unternehmen agiert als B2B-Softwareanbieter (SaaS) und verkauft seine KI-gestützte
    Vertriebslösung an Unternehmen im Bereich Business- und Produktivitätssoftware.
