sections:
  loesung: >-
    Arctory provides a platform that allows manufacturing companies to build custom applications
    for shopfloor management, production planning, and maintenance. The system integrates
    directly on top of existing records such as ERP, MES, and PLM systems. Users describe
    their specific processes to generate functional apps without manual coding.
  mehrwerte: >-
    The platform enables rapid digitalization of manufacturing processes by replacing manual
    work in Excel with custom apps. The company has successfully built over 12 shopfloor applications
    per factory within a six-month period to streamline operations and improve data flow.
  usp: >-
    Unlike traditional IT projects that require extensive development time, Arctory uses agentic
    AI to generate applications in minutes. The system ensures data security by only sharing
    software code and data models with the AI during the creation phase, ensuring the AI has
    no access to production data once deployed.
  zielgruppe: >-
    The target customers are manufacturing companies and operational excellence teams requiring
    shopfloor management and quality audit tools. The company has secured references from
    partners such as ams OSRAM and Ventilatorenfabrik Oelde.
  geschaeftsmodell: >-
    Arctory operates as a software platform providing an AI-driven application builder for
    manufacturing companies to digitize their production processes.
