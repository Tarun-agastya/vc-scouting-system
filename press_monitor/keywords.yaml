# Press monitor watch list — Allgäuer/Memminger Zeitung daily e-paper scan.
#
# Edit this file to change what's watched for — no code change needed.
# Each entry is matched case-insensitively as a literal substring against
# each page's extracted text. Keep names as they'd actually appear in a
# newspaper article (a person's name or unrelated word can coincidentally
# match a short/common company name — e.g. "Reisacher" is also a real
# German surname — matches are NOT auto-filtered; every hit goes to a human
# via the email digest with its own summary + screenshot for a quick glance,
# same "evidence not guessing" stance as the rest of this project).

