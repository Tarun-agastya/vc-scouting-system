# ══════════════════════════════════════════════════════════════════════════
# Controlled classification taxonomy (Phase V-1, 24 Jul)
#
# The FIXED vocabulary that every startup's `industry` and `tech_cluster` is
# classified into (Phase V-2 constrains the LLM to these exact values, so the
# database stops filling with free-form noise like "Proptech - Fashion Tech").
# Stakeholder theses (config/theses.yaml) reference these same terms, so
# accurate classification and accurate thesis-matching are one and the same.
#
# HOW TO EDIT:
#   - `industries`: the top-level buckets (keep this list fairly short/stable).
#   - `tech_clusters`: finer domains, grouped UNDER an industry. A startup gets
#     exactly one industry + one tech_cluster. Add a cluster by putting it under
#     the right industry; add an industry by adding a top-level key here AND an
#     entry in `industries`. Hot-reloaded — no restart needed.
#
# The first four industries are deliberately the partners' core verticals
# (Mobility, Energy, Construction, Packaging); the rest cover general startup
# tech so the whole DB classifies, not just partner-adjacent companies.
# ══════════════════════════════════════════════════════════════════════════

industries:
  - Mobility & Automotive
  - Energy & CleanTech
  - Construction & Real Estate
  - Packaging & Materials
  - Manufacturing & Industry 4.0
  - AI & Machine Learning
  - B2B SaaS & Enterprise Software
  - FinTech & InsurTech
  - Health & Life Sciences
  - Food & AgTech
  - Logistics & Supply Chain
  - Retail & E-Commerce
  - Cybersecurity
  - HR & Future of Work
  - Marketing & Sales Tech
  - Robotics & Hardware
  - Climate & Environment
  - Consumer & Lifestyle
  - GovTech & Education
  - Other / Uncategorized

