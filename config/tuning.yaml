# ══════════════════════════════════════════════════════════════════════════
# VC Scouting — Tuning Knobs (Phase S-2)
# ══════════════════════════════════════════════════════════════════════════
#
# Business rules that used to be hardcoded in Python. Edit here to change what
# the pipeline extracts, what it pre-filters, and how it scores — no code change.
# Re-read fresh whenever the file changes (cached by modification time, so
# per-chunk reads stay fast). A broken edit falls back to the last good version,
# then to built-in defaults — the pipeline never crashes on a bad edit here.
#
# ── Sections ─────────────────────────────────────────────────────────────
#   extraction        — what the LLM should INCLUDE / EXCLUDE when extracting
#   candidate_filter  — the cheap pre-LLM relevance filter (keywords + thresholds)
#   scoring           — source-quality weights, diversity bonuses, tier cutoffs
# ══════════════════════════════════════════════════════════════════════════

extraction:
  # One sentence describing what counts as a target company.
  include: >-
    any company founded in the past 20 years operating in technology, software,
    AI, hardware, fintech, climatetech, deeptech, proptech, logistics, or B2B SaaS
    — regardless of funding stage or size. VC-backed companies, unicorns, and
    growth-stage companies are all valid targets.
  # Bullet rules for what to leave out. Add/remove lines to change policy
  # (e.g. delete the medicine/biotech line to start tracking healthtech).
  exclude:
    - "Traditional incumbents: established non-tech corporations such as car makers, banks, industrial conglomerates (e.g. BMW, Deutsche Bank, Siemens, McKinsey, SAP if founded before 2000)."
    - "VC firms, investment funds, accelerators, media outlets."
    - "Companies in medicine, biotech, e-commerce, or food retail (exception: packaging technology)."
    - "Companies headquartered/founded outside Europe (e.g. US, China, other Asia, elsewhere) — UNLESS the text explicitly states the company is expanding into, opening an office in, or specifically targeting the DACH/European market. Being mentioned in a German or European publication purely as general industry news or founder-profile commentary is NOT sufficient reason to include a non-European company — e.g. a German newsletter profiling a Chinese AI lab's founder is industry commentary, not a DACH/Europe startup to track."
    - "Named events, pitch days, competitions, or programs run by the accelerator/host organisation itself (e.g. 'Pitch & Match', 'Demo Day 2026', 'Gründungsnetzwerk', a dated year-suffixed program name) — these are events, not companies, even when they appear inside a list of company names."
    - "Individual people — a founder, investor, speaker, or journalist mentioned by name (e.g. 'Marc Samwer', 'Frederic Westerberg') is NOT a company, even if the surrounding sentence discusses startups. Only extract the actual company they are associated with, and only if it is itself named in the text."
    - "Article headlines, subheadings, or section titles (e.g. 'Fünf Münchner Startups und ihre Lösungen für autonomes Fahren', 'Industrie 4.0: Wie Münchner Startups die Industrie digitalisieren') are not company names — extract the actual company or companies profiled UNDER that heading, never the heading text itself."


candidate_filter:
  # A text chunk must match at least `min_score` of the 4 signal groups AND
  # have at least `min_words` words to be sent to the LLM.
  min_score: 2
  min_words: 25
  # Each group is a list of terms/regex-fragments joined into one alternation
  # and matched case-insensitively with word boundaries. Plain words work fine;
  # advanced entries (e.g. "series\\s+[a-c]") are matched as regex.
  signals:
    startup:
      - startup
      - start-up
      - founded
      - co-founded
      - founder
      - ceo
      - cto
      - coo
      - cpo
      - managing\s+director
      - geschäftsführer
      - raised
      - funding
      - funded
      - investment
      - investor
      - venture
      - seed
      - series\s+[a-c]
      - pre-seed
      - post-seed
      - scale-up
      - scaleup
      - unicorn
      - soonicorn
      - accelerat
      - incubat
      - portfolio
      - spin-?off
      - spin-?out
      - pitch
      - traction
      - mrr
      - arr
      - runway
      - exit
      - ipo
    geo:
      - germany
      - deutschland
      - german
      - austria
      - österreich
      - austrian
      - switzerland
      - schweiz
      - swiss
      - munich
      - münchen
      - berlin
      - hamburg
      - frankfurt
      - cologne
      - köln
      - stuttgart
      - augsburg
      - nuremberg
      - nürnberg
      - düsseldorf
      - vienna
      - wien
      - graz
      - salzburg
      - linz
      - zurich
      - zürich
      - basel
      - geneva
      - genf
      - bern
      - europe
      - european
      - dach
    tech:
      - platform
      - software
      - saas
      - paas
      - api
      - sdk
      - ai
      - ml
      - llm
      - deep\s*learning
      - machine\s*learning
      - algorithm
      - autonomous
      - automation
      - cloud
      - data
      - analytics
      - dashboard
      - sensor
      - hardware
      - robot
      - drone
      - iot
      - marketplace
      - fintech
      - climatetech
      - proptech
      - insurtech
      - b2b
      - b2c
      - b2g
      - enterprise
      - product
      - solution
      - technology
      - digital
    company:
      - GmbH
      - AG
      - UG
      - Ltd
      - Inc
      - company
      - companies
      - firm
      - enterprise
      - venture
      - team


# ══════════════════════════════════════════════════════════════════════════
# Geo-scope hard filter (23 Jul) — deterministic backstop, not a prompt rule
# ══════════════════════════════════════════════════════════════════════════
# The extraction prompt's exclude rules alone don't reliably stop the small
# extraction model from pulling in companies outside our DACH/Europe scope —
# confirmed live: a German-newsletter profile of a Chinese AI founder
# (Moonshot AI) was still extracted despite an explicit "exclude non-Europe"
# prompt rule. Same lesson as Phase H-1's grounding gate: don't just tell the
# model, build a deterministic check.
#
# A chunk is REJECTED before ever reaching the LLM if it contains a clear
# non-Europe signal AND has no DACH/Europe geo signal at all (reusing
# candidate_filter.signals.geo above as the carve-out — a real "expanding to
# Europe" story naturally mentions a specific European place, e.g. "opening
# a Berlin office", so it passes through untouched). This is a hard reject,
# independent of the min_score check above.
geo_scope:
  enabled: true
  non_europe_signals:
    - china
    - chinese
    - beijing
    - shanghai
    - shenzhen
    - hong kong
    - india
    - indian
    - bangalore
    - mumbai
    - japan
    - japanese
    - tokyo
    - south korea
    - korean
    - seoul
    - singapore
    - silicon valley
    - san francisco

# Phase J (4 Aug) — deterministic post-extraction gate for institutions,
# established incumbents, and fabricated generic-noun-phrase fragments that
# the prompt-level EXCLUDE rules alone don't reliably catch (the same
# lesson as geo_scope above: prompt instructions are necessary but not
# sufficient, confirmed live twice now — the schwaben.digital 31 Jul
# incident and the hochschule-biberach.de "unser-netzwerk" partner-logo
# page 4 Aug, which extracted Liebherr/PERI/Goldbeck/Ed. Züblin alongside
# banks, chambers of commerce, and law firms). Drops the WHOLE extracted
# record (unlike grounding, which only nulls a field) — an institution is
# not a startup at all, there is no partial record worth keeping.
# institution_keywords: matched as a whole word/token in the lowercased
# name (not a loose substring) so a real company containing a similar word
# isn't false-positive dropped (mirrors ingestion/web_scraper.py's
# _ALT_NOISE exact-match discipline).
institutional_junk:
  enabled: true
  institution_keywords:
    - bank
    - sparkasse
    - volksbank
    - raiffeisenbank
    - kreissparkasse
    - stadtsparkasse
    - versicherung
    - krankenkasse
    - ihk
    - handwerkskammer
    - kammer
    - rechtsanwalt
    - rechtsanwälte
    - kanzlei
    - notariat
    - ministerium
    - landkreis
    - bezirksverband
    - gemeinde
    - stadtverwaltung
  # Known large, long-established incumbents that keep slipping through the
  # prompt-level "exclude traditional incumbents" rule specifically on
  # bare-name-list (logo-grid) pages, where the BARE NAME LISTS prompt
  # section's "don't skip an unfamiliar name" instruction can override the
  # general exclude rule's intent. A small, explicit, growing list — add an
  # entry whenever a new one is confirmed live, same living-list philosophy
  # as ingestion/web_scraper.py's SKIP_PATTERNS.
  known_incumbents:
    - liebherr
    - peri
    - goldbeck
    - "ed. züblin"
    - züblin
    - "wolff und müller"
    - "leonhard weiß"
    - rentschler
  # Fabricated generic noun-phrase fragments ("a digital agency", "ein
  # Games Studio") rather than real proper names — confirmed live 3 Aug on
  # schwaben.digital's /presse page. Matched as a regex against the whole
  # (stripped) name.
  generic_phrase_regex: "^(ein|eine|a|an)\\s+\\w"
  # Article headline/subheading/multi-entity-list junk — confirmed live
  # 4 Aug on a munich-startup.de crawl: ~272 evidence-free records whose
  # "names" were actually headlines ("Industrie 4.0: Wie Münchner Startups
  # die Industrie digitalisieren") or comma-concatenated company lists
  # ("menstruflow, Nouxx, nghty berlin, Olena Scent" — 4 companies merged
  # into one field). Verified against every name already in the DB before
  # shipping: 6/6 colon-bearing names and 5/5 names with 2+ commas were
  # confirmed junk, zero false positives.
  reject_colon: true
  reject_question_mark: true
  max_commas: 1   # a name with MORE than this many commas is rejected
  # "<German number word> ... startup(s)/gründer..." — the specific
  # "N Munich startups" headline shape ("Fünf Münchner Startups...",
  # "Sechs Münchner Startup-Gründerinnen..."). Verified against real
  # brand-name risk cases (Two Sigma, Six Flags, One Medical — none
  # start with a GERMAN number word, so none match) and against a real
  # DB entry containing "Gründerzentrum" that does NOT start with a
  # number word (correctly not matched).
  headline_number_pattern: "^(?=.*\\b(?:startups?|gr[üu]nder\\w*)\\b)(zwei|drei|vier|f[üu]nf|sechs|sieben|acht|neun|zehn)\\b"

# Phase P-1 (29 Jul): a soft, config-toggleable scouting bias for whichever
# theses in config/theses.yaml are marked `priority: true` (e.g. SÜDPACK's
# flexible/foil packaging + sterile-medical packaging focus). A chunk that
# matches a priority thesis's keywords gets `boost` added to its candidate
# score before the min_score gate — never a hard include/exclude, just a
# thumb on the scale so more matching chunks reach the LLM during sweeps.
# Mirrors geo_scope's enabled/mtime-cache shape exactly (see
# ingestion/candidate_filter.py). Off-switchable without a redeploy.
priority_scouting:
  enabled: true
  boost: 1


inspector:
  # Phase R-1: structural page analysis. Replaces per-website tuning — the
  # pipeline detects a page's SHAPE and picks a strategy, instead of constants
  # hand-fitted to one site (which is how zollhof tuning wrote 72 junk records
  # on schwaben.digital, 31 Jul).
  #
  # A "card group" = sibling elements sharing a class signature, i.e. the
  # repeating unit of a portfolio grid or company directory.
  min_group_items: 4          # fewer siblings than this is not a repeating group
  card_score_threshold: 0.55  # below this, the page has NO grid and NO alt harvest
  top_groups_reported: 5      # how many groups to keep in the signals payload

  # A card is "name only" (a logo grid) when its text is this short — those
  # pages yield name-only records and are the ones detail-page following helps.
  name_only_text_max_chars: 24
  # Fraction of a group's items that must be name-only for the group to be.
  name_only_min_fraction: 0.8

  # Group scoring weights. Tunable without code changes; see site_inspector.
  # max(unique_href, unique_name) carries the most weight because a directory's
  # defining property is that each item points somewhere different OR is named
  # differently — a nav bar repeats structure but not distinct entities.
  weights:
    unique_identity: 0.30
    has_link:        0.20
    has_heading:     0.15
    homogeneity:     0.15
    group_size:      0.10
    has_image:       0.10
    # A hard CEILING for a chrome-flagged group (nav/menu/footer/breadcrumb/
    # cookie/banner/partner/sponsor), not a subtraction — see
    # site_inspector.py::_score_group for why a soft penalty wasn't enough
    # (a breadcrumb trail scores ~0.90 on every other signal alone).
    nav_footer_cap:  0.15
    empty_text_penalty:  0.30

  # Rendering: escalate to a headless browser when rendering reveals this many
  # times more candidate entities than the static fetch. Measured on entity
  # COUNT, not character length — zollhof's homepage shows a 48.7x char gain
  # but the meaningful signal is that entities appear at all.
  render_gain_threshold: 2.0

  # Detail pages: fraction of a group's items that must link to a distinct URL
  # under a common path prefix before we treat it as a detail-page pattern.
  detail_link_min_coverage: 0.6

  # A page is prose-shaped when link text is a small share of its total text.
  prose_link_density_max: 0.45


chunking:
  # Logo-grid portfolio pages (each company is just a logo + alt-text name)
  # are extracted in name batches. Each name in a batch costs a full
  # 17-field JSON record of output, so batch size directly drives per-call
  # latency against the 75s extract timeout.
  #
  # Measured 30 Jul, zollhof.de portfolio (120 names):
  #   12 names/chunk -> 70-75s per call, at the timeout edge. Quiet machine
  #                     93/120 (78%); under load 62/120 (52%), 3 chunks lost.
  #    6 names/chunk -> roughly half the output, comfortable margin.
  # Raise only if calls are finishing well under the timeout.
  names_per_chunk: 6

scoring:
  # Best source-type contribution (Category A). Unknown types default to 4.
  source_type_score:
    accelerator: 20
    incubator: 20
    university_hub: 20
    startup_network: 12
    intelligence_platform: 12
    newsletter: 8
    rss: 4
    general: 4
  # Base trust of the primary source (source_confidence). Unknown default 10.
  source_confidence_base:
    accelerator: 45
    incubator: 45
    university_hub: 45
    startup_network: 30
    intelligence_platform: 30
    newsletter: 20
    rss: 10
    general: 10
  # Bonus indexed by min(unique_sources, 4): [0 srcs, 1, 2, 3, 4+]
  diversity_bonus:      [0, 0, 6, 10, 15]
  conf_diversity_bonus: [0, 0, 15, 25, 30]
  # Tier cutoffs, highest first: [min_score, label]
  tiers:
    - [81, PRIORITY]
    - [61, HIGH_QUALITY_LEAD]
    - [41, INTERESTING]
    - [21, EARLY_DISCOVERY]
    - [0, WEAK_SIGNAL]


# ══════════════════════════════════════════════════════════════════════════
# Phase H-1 — Source-grounding gate (hallucination cut)
# ══════════════════════════════════════════════════════════════════════════
# Deterministic, free, no-LLM check applied right after every extraction
# (reasoning/qwen_client.py::extract_startups). A high-fabrication-risk field
# is nulled unless the chunk it came from actually contains evidence for it.
# Paraphrased/classified fields (description, industry, tech_cluster, city,
# country) are NOT gated here — nulling a correct paraphrase would violate
# "gather the correct information"; those are left to the Phase H-3 LLM
# deep-recheck instead.
#
# Set enabled: false to disable the whole gate (pre-Phase-H behavior — trust
# the model's raw output). Each check_* toggle disables just that one field.
grounding:
  enabled: true

  check_founded_year: true    # the 4-digit year must appear literally in the chunk
  check_funding_stage: true   # the stage value itself (e.g. "Seed") must appear
  check_funding_amount: true  # needs BOTH a digit AND one of funding_amount_signals
  check_employee_count: true  # needs one of employee_count_signals nearby
  check_founders: true        # each founder's surname must appear in the chunk

  # A bare "is this 4-digit token anywhere in the chunk" check passes on a
  # coincidental date elsewhere in the text — found live 27 Jul on a Campus
  # Founders news-listing page where every blurb carries the article's own
  # publish date ("04/11/2024"), which the extractor mistook for three
  # different companies' founding year (RiDERgy, NextStepHR, DeepFile) and
  # the old bare-substring check couldn't tell apart from a real founding
  # statement. The year must now appear within founded_year_context_chars
  # of one of these signals.
  founded_year_context_chars: 60
  founded_year_signals:
    - founded
    - founded in
    - co-founded
    - established
    - est.
    - incorporated
    - started in
    - launched in
    - since
    - gegründet
    - gegr.
    - seit

  # Reference vocabulary for the funding_stage check (bilingual EN/DE) —
  # informational; the actual check matches the extracted value's own text.
  funding_stage_keywords:
    - pre-seed
    - preseed
    - vor-seed
    - vorseed
    - seed
    - series a
    - series b
    - series c
    - series d
    - series e
    - growth
    - angel
    - bridge
    - wachstumskapital
    - wachstumsrunde

  funding_amount_signals:
    - million
    - mio
    - billion
    - bn
    - thousand
    - tsd
    - €
    - "$"
    - usd
    - eur
    - dollar
    - euro
    - funding
    - raised
    - investment
    - eingesammelt
    - finanzierung
    - kapital
    - runde

  # Deliberately NOT "people" alone — found via Phase H-4 live testing to
  # false-positive-match unrelated text (e.g. the "Pitch & People" podcast
  # name), which let a fabricated employee_count survive grounding just
  # because a source article happened to mention that show's name.
  employee_count_signals:
    - employee
    - employees
    - headcount
    - staff
    - fte
    - team of
    - person team
    - people on the team
    - headcount of
    - mitarbeiter
    - beschäftigte
    - belegschaft
    - mann team
    - köpfe
