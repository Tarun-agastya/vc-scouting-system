  - id: alois_mueller
    name: Alois Müller
    kind: stakeholder
    active: true
    summary: >
      Alois Müller Group is an energy and building-services engineering company
      (technical building equipment / TGA) and industrial plant builder
      (~1,000 staff). Its divisions span heating, ventilation (including its
      own duct manufacturing) and air-conditioning, refrigeration and cooling,
      sanitary, electrical, photovoltaics, industrial piping and district
      heating, and gas / media supply, plus building automation and
      measurement-control-regulation (MSR) via its subsidiary ECONTEC MSR —
      an electrical-panel and controls specialist for HVAC and refrigeration
      automation. In its energy-self-sufficient "Green Factory" (1.5 MW PV,
      biogas CHP, pellet heating, high-temperature heat pump, battery storage)
      it manufactures steel/stainless piping and modular / containerised
      energy centres under two brands: Energy Unit (turnkey heating for
      multi-family buildings, with named product lines for heat-pump, pellet,
      oil/gas and modular "ModulPro" systems, built in CO2-neutral
      manufacturing) and Mobile Energy (rentable mobile heating/cooling units
      from 10 kW to 5,000 kW for construction sites, renovations and
      emergency/temporary supply). It is interested in startups in energy
      technology and decarbonisation: heat pumps (including high-temperature
      and industrial), energy storage (battery and thermal), photovoltaics and
      solar integration, building and industrial energy management and
      monitoring, demand response and energy flexibility, district-heating and
      thermal networks, CHP / cogeneration, refrigeration and waste-heat
      recovery, smart-building automation, MSR / IoT sensing and control
      panels, mobile / temporary / rental energy systems, modular and
      containerised energy plant, and digital planning tools for building
      services (MEP / TGA).
