# ══════════════════════════════════════════════════════════════════════════
# Scouting theses (Phase V-1, 24 Jul; deepened 24 Jul; group-entity research +
# secondary-interest layer added 27 Jul per colleague review)
#
# A "thesis" defines an interest profile the dashboard filters/ranks startups
# against. Each is a `stakeholder` (one of the four industrial partners) or an
# ad-hoc `theme` added on demand.
#
# HOW MATCHING WORKS (Phase V-3):
#   - `summary`  -> embedded for SEMANTIC search. Names the partner's actual
#                  divisions/products/group entities so a startup working on a
#                  SPECIFIC part of what they do is found even if its tags are
#                  imperfect. This is the most important field — write it richly.
#   - `industries`/`tech_clusters` -> PRIMARY boost when a startup's classified
#                  taxonomy values are in these lists. Must be exact
#                  taxonomy.yaml values. This is the partner's CORE field.
#   - `keywords` -> PRIMARY boost on a literal hit in the startup's
#                  name/description. Product/process-level specificity lives
#                  here (e.g. "asphalt recycling", "railroad ballast", "MSR").
#   - `secondary_industries`/`secondary_tech_clusters`/`secondary_keywords` ->
#                  a SMALLER boost for interests OUTSIDE the partner's core
#                  field — administration/back-office/workforce tooling that's
#                  useful to any company but isn't their scouting focus.
#                  Per owner + colleague decision (27 Jul): every company can
#                  use better admin/HR/ops tooling, but it should never
#                  outrank a genuine hit in the partner's own field — that's
#                  what the smaller boost weight (Phase V-3) enforces.
#
# Hot-reloaded — edit freely. Seeded from public research 24 Jul; deepened via
# each group's own subsidiary/brand websites 27 Jul (not just search snippets)
# per colleague's review note. Core profiles approved by the owner's colleague
# 27 Jul as a correct starting point.
# ══════════════════════════════════════════════════════════════════════════

# Shared secondary interest — "useful but not the focus" tooling that applies
# similarly to all four (family Mittelstand businesses of comparable size).
# Anchored to taxonomy.yaml's B2B SaaS & Enterprise Software / HR & Future of
# Work industries. Duplicated per-thesis (not a global default) so any one
# partner's admin-tech appetite can be tuned up/down independently later
# without a schema change — e.g. if someone says "actually Kutter cares a lot
# about workforce/skilled-labour tooling given 2,000 staff, more than the
# others do."
.admin_secondary: &admin_secondary
  secondary_industries:
    - B2B SaaS & Enterprise Software
    - HR & Future of Work
  secondary_tech_clusters:
    - ERP & Business Operations
    - Workflow & Productivity
    - HR Operations & Payroll
    - Collaboration & Communication
    - Recruiting & Talent
  secondary_keywords:
    - erp
    - back office
    - administration
    - accounting software
    - invoicing
    - procurement
    - payroll
    - hr software
    - recruiting software
    - workforce management
    - document management
    - process automation
    - digitization

