  - id: kutter
    name: Kutter
    kind: stakeholder
    active: true
    summary: >
      Kutter is one of southern Germany's largest family construction groups
      (~2,000 staff), organised in four divisions: building & turnkey
      construction (shell construction, turnkey, project development); road &
      civil engineering (roads from cycle paths to federal highways, drainage,
      sewers, district-heating pipelines, earthworks); Germany's largest
      road-milling / pavement-rehabilitation operation; and its own materials
      production. Materials production runs through named subsidiaries: BK-Kies
      (gravel/sand/split aggregate processing, landscape stone, and a preferred
      supplier of railroad ballast — KG1/KG2 — with ISO 50001-certified,
      energy-reducing processing and TU-Munich-certified quality control),
      Hans Hebel (gravel extraction using up to 80% recycled water for
      groundwater-compatible operation), and Result-Recycling (a licensed
      mineral-waste recycler turning construction/demolition debris into
      branded RC-Mix, RC-Concrete, RC-gravel and RC-brick-chipping products,
      with multi-site interim storage and environmental consulting). It is
      interested in startups across all of this: construction software, BIM
      and digital site management, construction robotics and automation,
      road-milling and pavement-condition sensing, asphalt production and
      recycled-asphalt (RAP) technology, quarry and aggregate processing,
      energy-efficient mineral processing, water recycling and treatment for
      quarrying, railroad/rail-infrastructure materials, low-carbon and
      recycled concrete and cement, alternative binders,
      construction-and-demolition waste recycling and urban mining,
      trenchless and pipeline / district-heating civil works, prefab and
      modular construction, and construction-machinery telematics,
      electrification and emissions reduction.
