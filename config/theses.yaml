  # ── REISACHER — automotive retail & mobility ────────────────────────────
  - id: reisacher
    name: Reisacher
    kind: stakeholder
    active: true
    summary: >
      Reisacher is a large family-owned BMW / MINI / BYD automotive dealer
      group in the Memmingen / Ulm / Augsburg / Munich region, run across new-
      and used-car sales, a mechanical service workshop, a body-and-paint
      shop, spare parts, and financing / leasing / insurance / trade-in,
      including its own e-mobility entity (Reisacher Electric Mobility) as an
      early BYD partner covering EV sales, charging and wallbox planning, and
      fleet / commercial-customer business. It is interested in startups that
      improve any part of the car retail and aftersales value chain: digital
      showrooms and online car sales, dealer management systems and CRM, lead
      generation, digital finance-and-insurance, AI used-car valuation and
      remarketing, damage and inspection detection, workshop and service
      management, predictive maintenance and diagnostics, tyre and parts
      management, EV charging and charge/energy management, battery health,
