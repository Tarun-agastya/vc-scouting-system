  - id: suedpack
    name: SÜDPACK
    kind: stakeholder
    active: true
    summary: >
      SÜDPACK is a technology-leading manufacturer of flexible high-performance
      packaging films, made by co-extrusion, for food, medical, pharmaceutical
      and technical products — product lines include skin-packaging (SkinPro),
      composite and mono-material barrier films (Multifol, Pure-Line / PurePP),
      vacuum and modified-atmosphere packaging, and lidding films, with flexo,
      gravure, offset and digital printing. Its Medica division is a top-5
      European sterile-barrier packaging provider for medical, pharma and
      diagnostics, with named product lines MedGuard (thermoforming and
      form-fill-seal systems), PharmaGuard (recyclable mono-material blister),
      NutriGuard (nutraceuticals) and MedHub (standardised medical bags),
      meeting GMP/cleanroom standards for incontinence care, wound care and
      diagnostics. It drives the circular economy hard: mono-material
      design-for-recycling, mechanical recycling, and chemical recycling
      through CARBOLIQ, a chemical recycler it majority-owns whose "direct
      oiling" catalytic tribochemical conversion (CTC) process — unlike most
      pyrolysis — can process PA and PET plastics plus mixed/contaminated
      waste at under 400°C, yielding virgin-grade oil for new plastics. It is
      interested in startups in film and co-extrusion technology, high-barrier
      and functional coatings that replace aluminium or multilayer laminates,
      recyclable mono-materials, biopolymers and compostables, chemical /
      advanced recycling and pyrolysis-adjacent processes, mechanical
      recycling and food-grade recyclate decontamination, plastics sorting
      (NIR, AI, digital watermarks), active and intelligent packaging and
      freshness / shelf-life sensing, sterile and medical/pharma packaging,
      printing technology for flexible packaging, materials science and
      additives, and packaging LCA / carbon footprint — including healthcare
      supply-chain emissions specifically.
